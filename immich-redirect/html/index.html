<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Immich…</title>
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;text-align:center}
    a{color:#9cf}
  </style>
</head>
<body>
  <div>
    <p>Opening Immich…</p>
    <p><a id="fallback" href="#">If nothing happens, tap here.</a></p>
  </div>
  <script>
    // Edit these two if needed:
    const WEB_URL = "http://16.242.6.136:2283";
    const IOS_APP_URL = "immich://"; // confirmed scheme from Immich Info.plist

    const ua = navigator.userAgent || "";
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);

    document.getElementById("fallback").href = WEB_URL;

    if (isIOS) {
      // Try the app; if it isn't installed, fall back to the web after a short delay.
      const fallback = setTimeout(() => { window.location.href = WEB_URL; }, 1200);
      // If the page is hidden (app launched), cancel the fallback.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearTimeout(fallback);
      });
      window.location.href = IOS_APP_URL;
    } else {
      window.location.href = WEB_URL;
    }
  </script>
</body>
</html>
