browser_mod:
default_config:

# Reverse proxy (Caddy runs on this host, so it connects from localhost)
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# Keep the SD card happy: fewer writes, shorter history, no 30s Beszel polling in the db
recorder:
  purge_keep_days: 7
  commit_interval: 30
  exclude:
    entity_globs:
      - sensor.beszel_*

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
rest_command:
  discord_notify:
    url: !secret discord_webhook_url
    method: POST
    headers:
      Content-Type: "application/json"
    payload: '{"content": "{{ message }}"}'
    content_type: "application/json; charset=utf-8"
rest: !include rest.yaml
template: !include templates.yaml
