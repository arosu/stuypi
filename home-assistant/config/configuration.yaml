browser_mod:
default_config:
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
rest_command:
  discord_notify:
    url: !secret discord_webhook_url
    method: POST
    headers:
      Content-Type: "application/json"
    payload: '{"content": "{{ message }}"}'
    content_type: "application/json; charset=utf-8"
rest:
  - resource: http://localhost:2283/api/server/statistics
    scan_interval: 600
    headers:
      x-api-key: !secret immich_api_key
      Accept: application/json
    sensor:
      - name: Immich Photos
        unique_id: immich_photos
        value_template: "{{ value_json.photos }}"
        state_class: total
        icon: mdi:image-multiple
      - name: Immich Videos
        unique_id: immich_videos
        value_template: "{{ value_json.videos }}"
        state_class: total
        icon: mdi:video
      - name: Immich Storage
        unique_id: immich_storage
        value_template: "{{ (value_json.usage / 1024**3) | round(1) }}"
        unit_of_measurement: GB
        state_class: total
        icon: mdi:database
      - name: Immich Alex Photos
        unique_id: immich_alex_photos
        value_template: "{{ value_json.usageByUser | selectattr('userName', 'eq', 'Alexandru Rosu') | map(attribute='photos') | first }}"
        state_class: total
        icon: mdi:image
      - name: Immich Alex Videos
        unique_id: immich_alex_videos
        value_template: "{{ value_json.usageByUser | selectattr('userName', 'eq', 'Alexandru Rosu') | map(attribute='videos') | first }}"
        state_class: total
        icon: mdi:video
      - name: Immich Alex Storage
        unique_id: immich_alex_storage
        value_template: "{{ (value_json.usageByUser | selectattr('userName', 'eq', 'Alexandru Rosu') | map(attribute='usage') | first / 1024**3) | round(1) }}"
        unit_of_measurement: GB
        state_class: total
        icon: mdi:database
      - name: Immich Ioana Photos
        unique_id: immich_ioana_photos
        value_template: "{{ value_json.usageByUser | selectattr('userName', 'eq', 'Ioana Clotea') | map(attribute='photos') | first }}"
        state_class: total
        icon: mdi:image
      - name: Immich Ioana Videos
        unique_id: immich_ioana_videos
        value_template: "{{ value_json.usageByUser | selectattr('userName', 'eq', 'Ioana Clotea') | map(attribute='videos') | first }}"
        state_class: total
        icon: mdi:video
      - name: Immich Ioana Storage
        unique_id: immich_ioana_storage
        value_template: "{{ (value_json.usageByUser | selectattr('userName', 'eq', 'Ioana Clotea') | map(attribute='usage') | first / 1024**3) | round(1) }}"
        unit_of_measurement: GB
        state_class: total
        icon: mdi:database
  - resource: http://localhost:9928
    scan_interval: 30
    sensor:
      - name: "Beszel CPU"
        value_template: "{{ value_json.get('system', {}).get('cpu') }}"
        availability: "{{ value_json.get('system', {}).get('cpu') is number }}"
        unit_of_measurement: "%"

      - name: "Beszel Memory"
        value_template: "{{ value_json.get('system', {}).get('memory') }}"
        availability: "{{ value_json.get('system', {}).get('memory') is number }}"
        unit_of_measurement: "%"

      - name: "Beszel Disk"
        value_template: "{{ value_json.get('system', {}).get('disk') }}"
        availability: "{{ value_json.get('system', {}).get('disk') is number }}"
        unit_of_measurement: "%"

      - name: "Beszel CPU Temp"
        value_template: "{{ value_json.get('system', {}).get('temp_cpu') }}"
        availability: "{{ value_json.get('system', {}).get('temp_cpu') is number }}"
        unit_of_measurement: "°C"

      - name: "Beszel Memory Used"
        value_template: "{{ value_json.get('system', {}).get('memory_used_gb') }}"
        availability: "{{ value_json.get('system', {}).get('memory_used_gb') is number }}"
        unit_of_measurement: "GB"

      - name: "Beszel Memory Total"
        value_template: "{{ value_json.get('system', {}).get('memory_total_gb') }}"
        availability: "{{ value_json.get('system', {}).get('memory_total_gb') is number }}"
        unit_of_measurement: "GB"
template:
  - fan:
      - name: Bedroom AC
        unique_id: bedroom_ac_fan
        default_entity_id: fan.bedroom_ac
        state: "{{ states('light.bedroom_ac') }}"
        turn_on:
          - action: light.turn_on
            target:
              entity_id:
                - light.bedroom_ac
        turn_off:
          - action: light.turn_off
            target:
              entity_id:
                - light.bedroom_ac
      - name: Office AC
        unique_id: office_ac_fan
        default_entity_id: fan.office_ac
        state: "{{ states('light.office_ac') }}"
        turn_on:
          - action: light.turn_on
            target:
              entity_id:
                - light.office_ac
        turn_off:
          - action: light.turn_off
            target:
              entity_id:
                - light.office_ac
      - name: Fan
        unique_id: dreo_fan_homekit
        default_entity_id: fan.dreo_fan_homekit
        state: "{{ states('fan.fan_2') }}"
        turn_on:
          - action: fan.turn_on
            target:
              entity_id:
                - fan.fan_2
        turn_off:
          - action: fan.turn_off
            target:
              entity_id:
                - fan.fan_2
      - name: Dyson
        unique_id: dyson
        default_entity_id: fan.dyson
        state: "{{ states('fan.purifier_cool_e_series_tp07_tp09') }}"
        turn_on:
          - action: fan.turn_on
            target:
              entity_id:
                - fan.purifier_cool_e_series_tp07_tp09
        turn_off:
          - action: fan.turn_off
            target:
              entity_id:
                - fan.purifier_cool_e_series_tp07_tp09
    switch:
      - name: Towel Heater
        default_entity_id: switch.towel_heater
        state: "{{ states('light.towel_heater') }}"
        turn_on:
          - action: light.turn_on
            target:
              entity_id:
                - light.towel_heater
        turn_off:
          - action: light.turn_off
            target:
              entity_id:
                - light.towel_heater
    cover:
      - name: Bedroom Shade 1 HomeKit
        unique_id: bedroom_shade_1_homekit
        default_entity_id: cover.bedroom_shade_1_homekit
        state: "{{ states('cover.bedroom_shade_1') }}"
        open_cover:
          - action: cover.open_cover
            target:
              entity_id: cover.bedroom_shade_1
        close_cover:
          - action: cover.close_cover
            target:
              entity_id: cover.bedroom_shade_1
        stop_cover:
          - action: cover.stop_cover
            target:
              entity_id: cover.bedroom_shade_1
      - name: Bedroom Shade 2
        unique_id: bedroom_shade_2_homekit_v2
        default_entity_id: cover.bedroom_shade_2_homekit
        availability: >-
          {{ states('cover.bedroom_shade_2_raw') not in ['unknown', 'unavailable']
             and state_attr('cover.bedroom_shade_2_raw', 'current_position') is number }}
        position: >-
          {{ state_attr('cover.bedroom_shade_2_raw', 'current_position') | int }}
        set_cover_position:
          - action: cover.set_cover_position
            target:
              entity_id: cover.bedroom_shade_2_raw
            data:
              position: "{{ position | int }}"
        open_cover:
          - action: cover.set_cover_position
            target:
              entity_id: cover.bedroom_shade_2_raw
            data:
              position: 100
        close_cover:
          - action: cover.set_cover_position
            target:
              entity_id: cover.bedroom_shade_2_raw
            data:
              position: 0
        stop_cover:
          - action: cover.stop_cover
            target:
              entity_id: cover.bedroom_shade_2_raw
    sensor:
      - name: >
          {% if is_state('sun.sun', 'above_horizon') %}Sunset{% else %}Sunrise{% endif %}

        unique_id: next_sun_event
        default_entity_id: sensor.next_sun_event
        state: >
          {% set t = state_attr('sun.sun', 'next_setting' if is_state('sun.sun', 'above_horizon') else 'next_rising') %} {{ (t | as_datetime | as_local).strftime('%-I:%M %p') }}

        icon: >-
          {% if is_state('sun.sun', 'above_horizon') %}
            mdi:weather-sunset-down
          {% else %}
            mdi:weather-sunset-up
          {% endif %}
      - name: Services Up
        unique_id: services_up
        icon: mdi:check-circle
        state: >
          {{ states.sensor
             | selectattr('entity_id', 'match', '.*_status$')
             | selectattr('state', 'eq', 'up')
             | list | count }}
      - name: Services Down
        unique_id: services_down
        icon: mdi:alert-circle
        state: >-
          {{ states.sensor
             | selectattr('entity_id', 'match', '.*_status$')
             | rejectattr('state', 'eq', 'up')
             | list | count }}
      - name: Fan Temperature Celsius
        unique_id: fan_temperature_celsius
        default_entity_id: sensor.fan_temperature_celsius
        unit_of_measurement: "°C"
        state_class: measurement
        state: >-
          {{ ((states('sensor.fan_temperature') | float - 32) * 5 / 9) | round(1) }}
      - name: Purifier Temperature Celsius
        unique_id: purifier_temperature_celsius
        default_entity_id: sensor.purifier_temperature_celsius
        unit_of_measurement: "°C"
        state_class: measurement
        state: >-
          {{ ((states('sensor.purifier_cool_e_series_tp07_tp09_temperature') | float - 32) * 5 / 9) | round(1) }}
        attributes:
          humidity: "{{ states('sensor.purifier_cool_e_series_tp07_tp09_humidity') }}%"
      - name: Indoor Humidity
        unique_id: indoor_humidity
        default_entity_id: sensor.indoor_humidity
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ is_number(states('sensor.purifier_cool_e_series_tp07_tp09_humidity')) }}"
        state: "{{ states('sensor.purifier_cool_e_series_tp07_tp09_humidity') | float | round(0) }}"
      - name: Outdoor Temperature Celsius
        unique_id: outdoor_temperature_celsius
        default_entity_id: sensor.outdoor_temperature_celsius
        unit_of_measurement: "°C"
        state_class: measurement
        availability: "{{ state_attr('weather.forecast_home', 'temperature') is number }}"
        state: >-
          {{ ((state_attr('weather.forecast_home', 'temperature') | float - 32) * 5 / 9) | round(1) }}
      - name: Bedroom Discomfort Index
        unique_id: bedroom_discomfort_index
        default_entity_id: sensor.bedroom_discomfort_index
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.fan_temperature_celsius'))
             and is_number(states('sensor.indoor_humidity')) }}
        state: >-
          {% set t = states('sensor.fan_temperature_celsius') | float %} {% set rh = states('sensor.indoor_humidity') | float %} {{ (t - (0.55 * (1 - (rh / 100)) * (t - 14.5))) | round(1) }}
      - name: Living Room Discomfort Index
        unique_id: living_room_discomfort_index
        default_entity_id: sensor.living_room_discomfort_index
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.purifier_temperature_celsius'))
             and is_number(states('sensor.indoor_humidity')) }}
        state: >-
          {% set t = states('sensor.purifier_temperature_celsius') | float %} {% set rh = states('sensor.indoor_humidity') | float %} {{ (t - (0.55 * (1 - (rh / 100)) * (t - 14.5))) | round(1) }}
    binary_sensor:
      - name: Bedroom Cooling Needed
        unique_id: bedroom_cooling_needed
        default_entity_id: binary_sensor.bedroom_cooling_needed
        icon: mdi:air-conditioner
        state: |-
          {% set t = states('sensor.fan_temperature_celsius') | float(-99) %}
          {% set d = states('sensor.bedroom_discomfort_index') | float(-99) %}
          {% set outside = states('sensor.outdoor_temperature_celsius') | float(-99) %}
          {{ d >= 24.5 or t >= 26.5 or (outside >= 28 and d >= 24.0) }}
      - name: Living Room Cooling Needed
        unique_id: living_room_cooling_needed
        default_entity_id: binary_sensor.living_room_cooling_needed
        icon: mdi:air-conditioner
        state: |-
          {% set t = states('sensor.purifier_temperature_celsius') | float(-99) %}
          {% set d = states('sensor.living_room_discomfort_index') | float(-99) %}
          {% set outside = states('sensor.outdoor_temperature_celsius') | float(-99) %}
          {{ d >= 24.5 or t >= 26.5 or (outside >= 28 and d >= 24.0) }}
