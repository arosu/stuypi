- id: '1778101450803'
  alias: Good Evening at Sunset
  description: Run Good Evening if couch or hallway is on at sunset
  triggers:
  - trigger: sun
    event: sunset
    offset: -00:30:00
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.couch
      state: 'on'
    - condition: state
      entity_id: light.hallway
      state: 'on'
  actions:
  - action: script.good_evening
  mode: single
- id: '1778102183758'
  alias: Main Switch turn on/off everything
  description: ''
  triggers:
  - device_id: ddaf15587de09778ed684181c576fdcc
    domain: hue
    type: initial_press
    subtype: 1
    unique_id: 1645b2dc-5b54-49e5-9dc6-9b8a17d9c2cc
    trigger: device
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{
            expand(
              'light.bedroom_ac',
              'light.office_ac',
              'light.couch',
              'light.hallway',
              'light.lamp',
              'light.nightstand',
              'light.towel_heater',
              'fan.purifier_cool_e_series_tp07_tp09',
              'fan.fan_2',
              'media_player.5e_pod',
              'media_player.plex_plex_for_apple_tv_apple_tv',
              'media_player.living_room'
            )
            | selectattr('state', 'in', ['on', 'playing', 'paused'])
            | list
            | count > 0
          }}
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedroom_ac
          - light.office_ac
          - light.couch
          - light.hallway
          - light.lamp
          - light.nightstand
          - light.towel_heater
        data:
          transition: 1
      - action: fan.turn_off
        target:
          entity_id:
          - fan.purifier_cool_e_series_tp07_tp09
          - fan.fan_2
      - action: media_player.turn_off
        target:
          entity_id:
          - media_player.5e_pod
          - media_player.plex_plex_for_apple_tv_apple_tv
          - media_player.living_room
    - conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - action: script.good_evening
      - if:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
          for:
            hours: 2
        then:
        - action: cover.close_cover
          target:
            entity_id:
            - cover.bedroom_shade_1
            - cover.bedroom_shade_2_homekit
      - action: script.main_switch_temperature_cooling
    default:
    - action: script.good_morning
    - action: script.main_switch_temperature_cooling
  mode: restart
- id: '1778103900001'
  alias: Low Battery Alert
  description: Discord notif when any device's battery drops below 20%
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.main_switch_battery
    - sensor.office_switch_battery
    below: 10
    for:
      minutes: 10
  conditions: []
  actions:
  - action: rest_command.discord_notify
    data:
      message: "\U0001F50B **{{ trigger.to_state.attributes.friendly_name or trigger.entity_id
        }}** battery dropped to {{ trigger.to_state.state }}%"
  mode: parallel
- id: '1778104210971'
  alias: Main Switch dim couch and hallway
  description: Up/down buttons on the main switch adjust couch+hallway by ±10%
  triggers:
  - device_id: ddaf15587de09778ed684181c576fdcc
    domain: hue
    type: initial_press
    subtype: 2
    trigger: device
    id: up
  - device_id: ddaf15587de09778ed684181c576fdcc
    domain: hue
    type: initial_press
    subtype: 3
    trigger: device
    id: down
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.couch
      - light.hallway
    data:
      brightness_step_pct: '{{ 10 if trigger.id == ''up'' else -10 }}'
  mode: parallel
- id: '1778105277212'
  alias: HomeKit buttons → scripts
  description: Bridge input_button presses to the matching script
  triggers:
  - trigger: state
    entity_id: input_button.good_night
    id: night
  - trigger: state
    entity_id: input_button.good_evening
    id: evening
  - trigger: state
    entity_id: input_button.good_morning
    id: morning
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.good_{{ trigger.id }}
  mode: parallel
- id: '1778200000001'
  alias: Office Switch toggle lamp and office AC
  description: Button 1 toggles light.lamp, button 4 toggles light.office_ac
  triggers:
  - device_id: f930d23eab0cf687dba501bd4ee5a1ae
    domain: hue
    type: initial_press
    subtype: 1
    trigger: device
    id: lamp
  - device_id: f930d23eab0cf687dba501bd4ee5a1ae
    domain: hue
    type: initial_press
    subtype: 4
    trigger: device
    id: ac
  conditions: []
  actions:
  - action: light.toggle
    target:
      entity_id: '{{ ''light.lamp'' if trigger.id == ''lamp'' else ''light.office_ac''
        }}'
  mode: parallel
- id: '1778200000002'
  alias: Office Switch dim lamp
  description: Up/down buttons on the office switch adjust light.lamp by ±10%
  triggers:
  - device_id: f930d23eab0cf687dba501bd4ee5a1ae
    domain: hue
    type: initial_press
    subtype: 2
    trigger: device
    id: up
  - device_id: f930d23eab0cf687dba501bd4ee5a1ae
    domain: hue
    type: initial_press
    subtype: 3
    trigger: device
    id: down
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: light.lamp
    data:
      brightness_step_pct: '{{ 10 if trigger.id == ''up'' else -10 }}'
  mode: parallel
- id: '1778283997028'
  alias: Plex Movie Lighting Automation
  description: Dim lights during playback, restore when not playing (after sunset)
  triggers:
  - id: playing
    entity_id: media_player.plex_plex_for_apple_tv_apple_tv
    to: playing
    trigger: state
  - id: not_playing
    entity_id: media_player.plex_plex_for_apple_tv_apple_tv
    from: playing
    trigger: state
  conditions:
  - condition: sun
    after: sunset
    after_offset: -00:30:00
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.couch
        data:
          brightness_pct: 50
      - action: light.turn_on
        target:
          entity_id: light.hallway
        data:
          brightness_pct: 20
    - conditions:
      - condition: trigger
        id: not_playing
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.couch
          - light.hallway
        data:
          brightness_pct: 100
  mode: restart
- id: '1779408000000'
  alias: Close Bedroom Shades 2h After Sunset
  description: Close bedroom shades two hours after sunset if it's not already closed
  triggers:
  - trigger: sun
    event: sunset
    offset: 02:00:00
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.couch
      state: 'on'
    - condition: state
      entity_id: light.hallway
      state: 'on'
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: cover.bedroom_shade_1
        state: closed
    - condition: not
      conditions:
      - condition: state
        entity_id: cover.bedroom_shade_2_homekit
        state: closed
  actions:
  - action: cover.close_cover
    target:
      entity_id:
      - cover.bedroom_shade_1
      - cover.bedroom_shade_2_homekit
  mode: single
- id: '1784696400000'
  alias: Bedroom Hot Room Assist
  description: Turn on bedroom cooling when the bedroom is uncomfortable while active at home
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_cooling_needed
    to: 'on'
    for:
      minutes: 15
  - trigger: state
    entity_id:
    - light.couch
    - light.hallway
    to: 'on'
    for:
      minutes: 2
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.couch
      state: 'on'
    - condition: state
      entity_id: light.hallway
      state: 'on'
  - condition: state
    entity_id: binary_sensor.bedroom_cooling_needed
    state: 'on'
  actions:
  - action: fan.turn_on
    target:
      entity_id: fan.bedroom_ac
  - action: fan.turn_on
    target:
      entity_id: fan.fan_2
    data:
      percentage: 100
      preset_mode: normal
  mode: single
- id: '1784696700000'
  alias: Living Room Hot Room Assist
  description: Turn on living room cooling when the living room is uncomfortable while active at home
  triggers:
  - trigger: state
    entity_id: binary_sensor.living_room_cooling_needed
    to: 'on'
    for:
      minutes: 15
  - trigger: state
    entity_id:
    - light.couch
    - light.hallway
    to: 'on'
    for:
      minutes: 2
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.couch
      state: 'on'
    - condition: state
      entity_id: light.hallway
      state: 'on'
  - condition: state
    entity_id: binary_sensor.living_room_cooling_needed
    state: 'on'
  actions:
  - action: fan.turn_on
    target:
      entity_id: fan.office_ac
  - action: fan.turn_on
    target:
      entity_id: fan.dyson
  mode: single
