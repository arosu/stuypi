good_night:
  sequence:
  - action: light.turn_off
    target:
      entity_id:
      - light.couch
      - light.hallway
      - light.lamp
      - light.nightstand
      - light.towel_heater
      - light.office_ac
    data:
      transition: 1
  - action: fan.turn_off
    target:
      entity_id: fan.purifier_cool_e_series_tp07_tp09
  - action: light.turn_on
    target:
      entity_id:
      - light.bedroom_ac
    data: {}
  - action: fan.turn_on
    target:
      entity_id: fan.fan_2
    data:
      percentage: 100
      preset_mode: normal
  - action: media_player.turn_off
    target:
      entity_id:
      - media_player.5e_pod
      - media_player.living_room
  - if:
    - condition: or
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.bedroom_shade_1
          state: closed
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.bedroom_shade_2_homekit
          state: closed
    then:
    - action: cover.close_cover
      target:
        entity_id:
        - cover.bedroom_shade_1
        - cover.bedroom_shade_2_homekit
  alias: Good Night
  description: ''
good_morning:
  sequence:
  - parallel:
    - action: light.turn_on
      target:
        entity_id: light.couch
      data:
        brightness_pct: 100
        transition: 1
    - action: light.turn_on
      target:
        entity_id: light.hallway
      data:
        brightness_pct: 100
        transition: 1
    - action: light.turn_off
      target:
        entity_id:
        - light.bedroom_ac
        - light.office_ac
        - light.lamp
        - light.nightstand
        - light.towel_heater
    - action: fan.turn_off
      target:
        entity_id: fan.fan_2
      data: {}
    - action: cover.open_cover
      target:
        entity_id:
        - cover.bedroom_shade_1
        - cover.bedroom_shade_2_homekit
  alias: Good Morning
  description: ''
good_evening:
  sequence:
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.all_lights_adaptive_lighting_all_lights
      lights:
      - light.couch
      - light.hallway
      - light.lamp
      - light.nightstand
      manual_control: true
  - parallel:
    - action: light.turn_on
      target:
        entity_id: light.couch
      data:
        brightness_pct: 100
        transition: 1
    - action: light.turn_on
      target:
        entity_id: light.hallway
      data:
        brightness_pct: 60
        transition: 1
    - action: light.turn_on
      target:
        entity_id: light.lamp
      data:
        brightness_pct: 60
        transition: 1
    - action: light.turn_on
      target:
        entity_id: light.nightstand
      data:
        brightness_pct: 100
        transition: 1
  - delay:
      seconds: 2
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.all_lights_adaptive_lighting_all_lights
      lights:
      - light.couch
      - light.hallway
      - light.lamp
      - light.nightstand
      manual_control: false
  - if:
    - condition: template
      value_template: "{{ is_state('binary_sensor.bedroom_cooling_needed', 'on') }}"
    then:
    - action: fan.turn_on
      target:
        entity_id: fan.bedroom_ac
    - action: fan.turn_on
      target:
        entity_id: fan.fan_2
      data:
        percentage: 100
        preset_mode: normal
  alias: Good Evening
  description: ''
main_switch_temperature_cooling:
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.bedroom_cooling_needed
      state: 'on'
    then:
    - action: fan.turn_on
      target:
        entity_id: fan.bedroom_ac
    - action: fan.turn_on
      target:
        entity_id: fan.fan_2
      data:
        percentage: 100
        preset_mode: normal
  - if:
    - condition: state
      entity_id: binary_sensor.living_room_cooling_needed
      state: 'on'
    then:
    - action: fan.turn_on
      target:
        entity_id: fan.office_ac
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.bedroom_cooling_needed
        state: 'on'
      - condition: state
        entity_id: binary_sensor.living_room_cooling_needed
        state: 'on'
    then:
    - action: fan.turn_on
      target:
        entity_id: fan.dyson
  alias: Main Switch Temperature Cooling
  description: ''
