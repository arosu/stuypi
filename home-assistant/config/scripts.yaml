good_night:
  sequence:
  - action: light.turn_off
    target:
      entity_id:
      - light.couch
      - light.hallway
      - light.lamp
      - light.nightstand
      - light.towel_heater
    data:
      transition: 3
  - action: light.turn_on
    target:
      entity_id:
      - light.fan
      - light.ac
  - action: media_player.turn_off
    target:
      entity_id:
      - media_player.5e_pod
      - media_player.living_room
  alias: Good Night
  description: ''
good_morning:
  sequence:
  - parallel:
    - action: light.turn_on
      target:
        entity_id: light.couch
      data:
        brightness_pct: 100
        transition: 2
    - action: light.turn_on
      target:
        entity_id: light.hallway
      data:
        brightness_pct: 100
        transition: 2
    - action: light.turn_off
      target:
        entity_id:
        - light.ac
        - light.fan
        - light.lamp
        - light.nightstand
        - light.towel_heater
  alias: Good Morning
  description: ''
good_evening:
  sequence:
  - parallel:
    - action: light.turn_on
      target:
        entity_id: light.couch
      data:
        brightness_pct: 100
        transition: 2
    - action: light.turn_on
      target:
        entity_id: light.hallway
      data:
        brightness_pct: 60
        transition: 2
    - action: light.turn_on
      target:
        entity_id: light.lamp
      data:
        brightness_pct: 60
        transition: 2
    - action: light.turn_on
      target:
        entity_id: light.nightstand
      data:
        brightness_pct: 100
        transition: 2
  alias: Good Evening
  description: ''
