services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/arosu/stuypi-services/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: America/New_York
